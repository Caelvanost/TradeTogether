[Network]
# TradeTogether v0.8.0 remote UDP base configuration.
# FOMOD users should select Remote Host or Remote Client.
Disabled=0
AutoDiscovery=0
LocalPort=27993

# Remote Host: leave PeerHost empty and forward UDP 27993 to this PC.
# Remote Client: set PeerHost to the Host's public IPv4 address.
PeerHost=
PeerPort=27993

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
RequestTimeoutMs=30000
SessionTimeoutMs=300000
