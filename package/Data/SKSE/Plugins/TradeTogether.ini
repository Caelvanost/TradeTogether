[Network]
# 0 = automatic LAN discovery (recommended).
Disabled=0
AutoDiscovery=1

# 1 = accept Internet clients and relay authenticated trade packets to every
# other active peer. Only the relay machine needs UDP port forwarding.
RelayMode=0

LocalPort=27993

# 1 = when this client connects to STR by direct connect, reuse the saved STR
# server host as the TradeTogether remote peer, but keep TradeTogether's own
# UDP port below. Example: STR 82.65.51.103:10578 -> TradeTogether
# 82.65.51.103:27993.
AutoRemoteFromSTR=1
AutoRemotePort=27993

# Optional. If enabled and SharedSecret is empty, a relay host reads STR's
# STServer.ini password, while clients read STR's saved direct-connect password.
AutoSharedSecretFromSTR=0

# Comma/semicolon-separated IPv4 addresses or DNS names. A port may follow
# each host. Leave empty when AutoRemoteFromSTR is enough.
# Example: RemotePeers=myhost.example:27993,203.0.113.8:27994
RemotePeers=

# Recommended for Internet play. Use the exact same private value on every
# client. When set, discovery and trade packets require HMAC-SHA256.
SharedSecret=

# Legacy single-peer setting. PeerHost is added to RemotePeers and supports
# DNS names as well as IPv4 addresses.
PeerHost=
PeerPort=27993

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
# The targeted player has this long to accept or refuse the request.
RequestTimeoutMs=30000

# Maximum inactivity while both players compose and confirm their offers.
SessionTimeoutMs=300000
