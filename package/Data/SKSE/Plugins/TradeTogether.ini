[Network]
# 0 = automatic LAN discovery (recommended).
Disabled=0
AutoDiscovery=1
LocalPort=27993

# Manual fallback for networks where broadcast discovery is unavailable.
# Set AutoDiscovery=0, then provide the other player's reachable IPv4/port.
PeerHost=
PeerPort=27993

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
# The targeted player has this long to accept or refuse the request.
RequestTimeoutMs=30000
