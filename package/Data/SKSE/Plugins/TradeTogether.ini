[Network]
# TradeTogether v0.9.0-udp base configuration.
# FOMOD users should select LAN, Remote Host or Remote Client.
Disabled=0
AutoDiscovery=0
AutoRemoteFromSTR=0
LocalPort=27993

# LAN: AutoDiscovery=1 on every PC; leave PeerHost empty.
# Remote Host: AutoDiscovery=0, leave PeerHost empty and forward UDP 27993.
# Remote Client: use AutoRemoteFromSTR=1, or set PeerHost manually as fallback.
PeerHost=
PeerPort=27993

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
RequestTimeoutMs=30000
SessionTimeoutMs=300000
