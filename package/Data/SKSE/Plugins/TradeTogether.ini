[Network]
# TradeTogether v0.9.4-strpm uses STR Plugin Messaging exclusively.
# No TradeTogether UDP socket, port forwarding, PeerHost or LAN discovery is used.
Disabled=0

[Trade]
# The targeted player has this long to accept or refuse the request.
RequestTimeoutMs=30000

# Maximum inactivity while both players compose and confirm their offers.
SessionTimeoutMs=300000
