[Network]
# LAN PROFILE
# Use this on both PCs when all players are on the same local network.
# TradeTogether discovers peers automatically by UDP broadcast.
Disabled=0
AutoDiscovery=1
AutoRemoteFromSTR=0
LocalPort=27993
PeerHost=
PeerPort=27993
DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
RequestTimeoutMs=30000
SessionTimeoutMs=300000
