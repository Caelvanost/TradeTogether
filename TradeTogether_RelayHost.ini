; TradeTogether v0.7.1 - optional relay host override
;
; Copy this file as:
; Data\SKSE\Plugins\TradeTogether_RelayHost.ini
;
; When present, this file overrides only the relay-facing network keys below.
; Keep the normal TradeTogether.ini installed beside it.

[Network]
Disabled=0
AutoDiscovery=0
RelayMode=1

LocalPort=27993

; The relay host should not auto-target its own STR client history.
AutoRemoteFromSTR=0
AutoRemotePort=27993

; Optional. Set to 1 to reuse STR's server password from:
; Data\SkyrimTogetherReborn\config\STServer.ini
AutoSharedSecretFromSTR=0

; Recommended for Internet play unless AutoSharedSecretFromSTR=1.
SharedSecret=replace-this-with-the-same-long-private-value
