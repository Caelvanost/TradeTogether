; TradeTogether v0.6.0 - Player2 Internet client
;
; Copy this file as:
; Data\SKSE\Plugins\TradeTogether.ini

[Network]
Disabled=0
AutoDiscovery=0
RelayMode=0

LocalPort=27993
DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

; Replace this with the relay public IP/DNS and forwarded UDP port.
RemotePeers=relay-public-ip-or-dns-name:27993

; Use the exact same private value on every TradeTogether client.
SharedSecret=replace-this-with-the-same-long-private-value

PeerHost=
PeerPort=27993

[Trade]
RequestTimeoutMs=30000
SessionTimeoutMs=300000
