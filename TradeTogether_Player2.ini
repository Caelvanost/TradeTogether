; TradeTogether v0.8.0-str-plugin - remote client
;
; Copy this file as:
; Data\SKSE\Plugins\TradeTogether.ini
;
; Uses STRPluginMessagingAPI.dll instead of opening a TradeTogether UDP port.

[Network]
Transport=STRPlugin
Disabled=0
AutoDiscovery=1
RelayMode=0

LocalPort=27993
AutoRemoteFromSTR=1
AutoRemotePort=27993
AutoSharedSecretFromSTR=0

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

; Manual fallback if STR has not saved the right address yet.
RemotePeers=

; Use the exact same private value on every TradeTogether client, or set
; AutoSharedSecretFromSTR=1 everywhere to reuse the STR password.
SharedSecret=

PeerHost=
PeerPort=27993

[Trade]
RequestTimeoutMs=30000
SessionTimeoutMs=300000
