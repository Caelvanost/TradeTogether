[Network]
# Host-labelled profile for the STR plugin transport experiment.
Transport=STRPlugin

# Legacy UDP settings below are ignored while Transport=STRPlugin.
Disabled=0
AutoDiscovery=0
RelayMode=1

LocalPort=27993

# The host should not auto-target its own STR client history.
AutoRemoteFromSTR=0
AutoRemotePort=27993

# Optional. Set to 1 to reuse STR's server password from:
# Data\SkyrimTogetherReborn\config\STServer.ini
AutoSharedSecretFromSTR=0

# Host mode learns remote clients from their outgoing hello packets.
RemotePeers=

# Recommended for Internet play. Use the exact same private value on every
# client, or set AutoSharedSecretFromSTR=1 everywhere to reuse the STR password.
SharedSecret=

PeerHost=
PeerPort=27993

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

[Trade]
# The targeted player has this long to accept or refuse the request.
RequestTimeoutMs=30000

# Maximum inactivity while both players compose and confirm their offers.
SessionTimeoutMs=300000
